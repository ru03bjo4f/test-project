# SQLite 版開發容器 (適用 OrbStack / Docker Desktop)
# 用法:  cd app && docker compose up
# 啟動後開 http://localhost:3000/admin
#
# 不需要外部資料庫 — SQLite 直接存成容器內 app/ 目錄下的 app.db 檔。

services:
  payload:
    image: node:22
    ports:
      - '3000:3000'
    working_dir: /home/node/app
    volumes:
      # 掛載原始碼 (改檔即時生效)
      - .:/home/node/app
      # node_modules 用具名 volume, 讓容器內自行編譯 Linux 原生模組
      # (sharp / sqlite), 避免與 macOS 主機的 node_modules 衝突
      - node_modules:/home/node/app/node_modules
    environment:
      # SQLite 資料庫檔 (存於掛載的 app/ 目錄)
      DATABASE_URL: file:./app.db
      # 開發用密鑰 — 正式環境請改成安全的隨機字串
      PAYLOAD_SECRET: change-me-to-a-random-secret
    # -H 0.0.0.0 讓 dev server 綁定所有介面, 容器外才連得到
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"

volumes:
  node_modules:
